[project]
name = "backend"
version = "1.0.0"
description = "GRID backend (FastAPI)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "bcrypt>=4.3.0",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "python-multipart>=0.0.32",
  "authlib>=1.9.1",
  "httpx>=0.28.1",
  "python-jose[cryptography]>=3.5.0",
  "cryptography>=42.0.8",
  "motor>=3.7.1",
  "slack_sdk>=3.45.0",
  "PyPDF2>=3.0.1",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "itsdangerous>=2.2.0",
  "python-dotenv>=1.2.4",
  "filetype>=1.2.0",
  "google-api-python-client>=2.201.0",
  "google-auth>=2.62.0",
  "google-auth-oauthlib>=1.5.0",
  "tzdata>=2026.5"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "cloudpathlib"
]
# Remote file storage (APP_STORAGE_URL). Install the extra matching your
# backend; the local-disk default needs none of these. See app/core/storage.py.
s3 = ["cloudpathlib[s3]>=0.26.0"]
azure = ["cloudpathlib[azure]>=0.26.0"]
gcs = ["cloudpathlib[gs]>=0.26.0"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["uploads*", "tests*"]

[tool.ruff.lint]
# Guardrail: forbid stray print() in application code (flake8-print / T20).
# Intentionally focused so `ruff check` can't fail on unrelated pre-existing
# lint; run broader rule sets separately if desired.
select = ["T20"]

[tool.ruff.lint.per-file-ignores]
# Dev-only CLI scripts, seeds, migrations and tests legitimately print.
"tests/**" = ["T20"]
"scripts/**" = ["T20"]
"create_test_*.py" = ["T20"]
"migrate_*.py" = ["T20"]
"seed_*.py" = ["T20"]

